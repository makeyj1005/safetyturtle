amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # 2026-08-07: 0.2 / 0.25 (기본값) 에서 낮췄다. 기본값은 "25cm 이동 또는 11.5도
    # 회전할 때마다 한 번 보정"이라는 뜻인데, 이 방은 순찰 사각형이 1.15m x 0.95m 라
    # 웨이포인트 사이 이동이 95cm 면 보정 기회가 3~4번뿐이고, 20cm 대 목표에서는 0번이다.
    # 보정을 못 하면 틀린 위치를 그대로 믿고 달려서 엉뚱한 곳으로 간다(실측: 중앙을
    # 찍었는데 오른쪽 벽으로 감, AMCL 방향이 -103도 -> +68도 로 도약).
    update_min_a: 0.05    # 0.2 -> 0.05 (약 2.9도마다 보정)
    update_min_d: 0.05    # 0.25 -> 0.05 (5cm 마다 보정)
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
