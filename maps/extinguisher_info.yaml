# 소화기 대장 — QR 로 식별해서 이 정보를 LCD·웹에 띄우고 점검 기록에 남긴다.
#
# [name 을 맞춰야 하는 곳]
#   fire_extinguisher_points.yaml  순찰 중 이 소화기로 가는 좌표
#   gauge_calib.yaml               압력계 판정 기준(ROI·기준사진)
#   여기(extinguisher_info.yaml)   대장 정보(제조년월·교체년월·책임자)
# 세 파일의 name 이 같아야 같은 소화기로 취급된다.
#
# [qr_id]
#   소화기에 붙인 QR 에 적힌 문자열. tools/make_qr.py 로 만든다.
#   ⚠️ QR 인코더가 한글을 못 넣으므로(라틴-1 바이트모드) 영문·숫자로 짓는다.
#   예: python3 tools/make_qr.py FE-01 --mm 100 --out logs/qr
#
# [날짜 형식]
#   YYYY-MM-DD. 라벨에 "2020.01" 처럼 월까지만 있으면 그 달 1일로 적는다.
#   소화기 내용연한은 보통 제조일로부터 10년이지만 제품마다 다르니 라벨을 볼 것.
#
# 2026-09-05 실물 라벨 확인 완료 — 아래는 실제 값이다.
extinguishers:
- name: 소화기1
  qr_id: "FE-01"              # 소화기에 붙인 QR 문자열
  mfg_date: "2024-01-01"      # 제조년월 2024.01 (라벨에 월까지만 있어 1일로 적음)
  expiry_date: "2033-12-01"   # 내용연한 2033.12 — 그 달 1일로 적는다.
                              # 말일(12-31)이 아니라 1일로 두면 경고가
                              # 한 달 일찍 뜬다. 안전장비는 늦는 쪽보다 낫다.
  manager: "홍길동"            # 책임자
  location: "1층 복도"         # 설치 위치(참고용)
