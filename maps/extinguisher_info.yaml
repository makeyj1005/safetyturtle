# 소화기 제조일·유효기한 등록. fire_extinguisher_points.yaml / gauge_calib.yaml 의
# name(예: 소화기1)과 같은 이름으로 맞춘다 — 압력계 판정과 유효기한 알림이 같은
# 소화기를 가리키게 하기 위함이다.
#
# ⚠️ 아래 mfg_date/expiry_date 는 아직 실제 값이 아니다(플레이스홀더) — 실물 소화기
# 라벨을 보고 실제 날짜로 바꿔야 한다. 날짜 형식은 YYYY-MM-DD.
# 소화기 내용연한은 보통 제조일로부터 10년(약관·제품마다 다를 수 있으니 라벨 확인).
extinguishers:
- name: 소화기1
  mfg_date: "2020-01-01"    # TODO: 실물 라벨의 제조년월로 교체할 것
  expiry_date: "2030-01-01" # TODO: 실물 라벨의 내용연한으로 교체할 것
