# 순찰 웨이포인트 — 2026-09-06, room_obs 지도 기준.
#
# [설계 의도]
# 소화기가 있는 구석은 벽 여유가 0.21m 로 로봇반경 0.10 + 인플레이션 0.12 =
# 0.22m 에 못 미쳐 Nav2 가 두 번 다 못 갔다(타임아웃). 그래서 구석에 들어가지
# 않고 **동선 위에서 소화기를 바라보고 지나간다**.
#   2번 지점: 소화기(0.412,-0.703)에서 0.44m — CSI 고정초점(30~50cm)에 맞고
#             벽 여유도 0.25m 로 넉넉하다. yaw 를 소화기 쪽(-156도)으로 돌려놨다.
#
# 모든 지점이 벽에서 0.24m 이상 떨어지도록 최소한만 옮겼다(중심으로 몰면
# 순찰 코스 모양이 뭉개진다).
#
# 로봇의 ROS 기준 "앞"은 CSI 카메라 쪽이다 — 라이다가 180도 돌아 달려 있어서
# scan_flip_node 로 보정했기 때문이다. 그래서 yaw 를 소화기로 두면 CSI 가 본다.
#
# ⚠️ room_obs 지도 전용. 지도를 다시 만들면 여기도 다시 찍어야 한다.
waypoints:
- name: 1번
  x: 0.676
  y: -0.153
  yaw: 0.0
- name: 2번-소화기점검
  x: 0.813
  y: -0.522
  yaw: -2.7176      # -156도, 소화기를 향한다
- name: 4번
  x: -0.324
  y: -0.922
  yaw: 1.5708
- name: 5번
  x: -0.282
  y: 0.009
  yaw: 0.0
